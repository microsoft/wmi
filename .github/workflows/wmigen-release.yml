name: wmigen release

on:
  push:
    tags:
      - 'wmigen/v*'

permissions:
  contents: read

concurrency:
  group: wmigen-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a versioned tag on master
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^wmigen/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must have the form wmigen/vX.Y.Z'
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo '::error::The release commit must already be merged into master'
            exit 1
          fi

  build:
    name: Build release
    needs: validate
    uses: ./.github/workflows/wmigen.yml

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wmigen-windows-net48
          path: dist

      - name: Verify and publish release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check wmigen-windows-net48.zip.sha256
          gh release create "$RELEASE_TAG" \
            wmigen-windows-net48.zip wmigen-windows-net48.zip.sha256 \
            --verify-tag --latest=false \
            --title "wmigen ${RELEASE_TAG#wmigen/}" \
            --notes "WMI wrapper generator built from commit ${GITHUB_SHA}. Requires Windows and .NET Framework 4.8. Includes the executable, configuration, README and MIT license; generated bindings are not included. Verify the ZIP with its SHA256 sidecar before use."
